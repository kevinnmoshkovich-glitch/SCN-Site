<script src="i18n.js"></script>
<script>
/* Same envelope as the refill portal: AES-GCM payload, key wrapped with the
   store's RSA public key. Encrypted before it leaves this device. */
const PUB_KEY_B64 = 'MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAvmGqbFmirSytH921UnBc7xzmzxoLgSPVvF3I12Zsq0fJrlYp94UdYzJ9c43zujm/fBq68sSEs+g1c86E30Y2YSCaG5ZbQmoO8/uLYbaYbULaloKVbPY2EJCmn3sdT3ZBmj1EXe9HybP2eM+uJ94HNAU1qNTeNI5+mFvYBH909AEtQ9QV+haIcds6/PmeQAQWzttbGQQMTf7JXu3Dx3+brWuXXYGIXbU0eeovUnURxQOryTaHSUjTu/77kzoB3SJcn8MFIADhDi5m2a4Z4cKz3oaVEd5MWid9b57CIi3ESkNK5WzFfKrseDlVm5ogWFJWi0d9GiAiqy6x2CCrAHSBjbgooqX2H/JUgmdIXU1Yuz5kSCMbb+cckNatFglq9pjnXivPpRKs9onj261VDvK63iwZfd7C0YLzWjwYcJw2fPM83icKD6zqLfKyH8yzfS2MZ2beE9NluETVDolFq6Yi7blN5eeY0+RgTdng03g9m0XUhMenPoOy/ipd5kNfeKMaPEIqdXQmYSrbR2zvUnQ4bJVJfB5qsaH/V5qR/05JCQcK4YwkRiBkuB3f0cRvRptho4XMtrP3DrfvwSVRLooHTnT+498Z2tuv/ijTzhfIR+pQKDxzZrVmjyW7boJsaHsQpUGKiAHwnv+DgCH1DONsD5aXRw2XlXE24VkhVbpg7BUCAwEAAQ==';
const FN = 'https://airmehkgolmtgctmhqaq.supabase.co/functions/v1';
const b64ToBuf = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
const bufToB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
async function encryptEnvelope(obj) {
  const pubKey = await crypto.subtle.importKey('spki', b64ToBuf(PUB_KEY_B64), { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['encrypt']);
  const aesKey = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = new TextEncoder().encode(JSON.stringify(obj));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aesKey, data);
  const rawAes = await crypto.subtle.exportKey('raw', aesKey);
  const wrapped = await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, pubKey, rawAes);
  return JSON.stringify({ v: 1, k: bufToB64(wrapped), iv: bufToB64(iv), d: bufToB64(ct) });
}

/* ---------- wizard state ---------- */
const A = { yn: {} };          // yes/no answers by question key
let step = 1; const LAST = 6;
const $ = (id) => document.getElementById(id);

function paintDots() {
  $('dots').innerHTML = '';
  for (let i = 1; i <= LAST; i++) { const d = document.createElement('i'); if (i <= step) d.className = 'done'; $('dots').appendChild(d); }
  $('stepStrip').textContent = t('step_of').replace('{n}', step) + ' · ' + t('wz' + step);
  $('stepTitle').textContent = t('wt' + step);
  document.querySelectorAll('.wstep').forEach((s) => s.classList.toggle('on', Number(s.dataset.step) === step));
  $('btnBack').style.display = step === 1 ? 'none' : '';
  $('btnNext').textContent = step === LAST ? t('submit') : t('cont');
  $('errline').classList.remove('on');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.addEventListener('langchange', paintDots);

/* yes/no toggles */
document.querySelectorAll('.yn').forEach((group) => {
  group.querySelectorAll('button').forEach((btn) => btn.addEventListener('click', () => {
    A.yn[group.dataset.q] = btn.dataset.v;
    group.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === btn));
    group.classList.remove('bad');
  }));
});
document.querySelectorAll('input, select, textarea').forEach((el) =>
  el.addEventListener('input', () => el.classList.remove('bad')));
$('f_cin').addEventListener('input', () => { $('f_cin').value = $('f_cin').value.toUpperCase(); });

/* household members */
let memberSeq = 0;
function addMemberRow() {
  const id = ++memberSeq;
  const div = document.createElement('div');
  div.className = 'member'; div.dataset.mid = id;
  div.innerHTML =
    '<button type="button" class="rm" aria-label="remove">✕</button>' +
    '<div class="grid2">' +
    '<div><label style="margin-top:0" data-i18n="hh_name"></label><input class="m_name"></div>' +
    '<div><label style="margin-top:0" data-i18n="hh_cin"></label><input class="m_cin" maxlength="8" style="text-transform:uppercase"></div>' +
    '<div><label data-i18n="hh_dob"></label><input class="m_dob" type="date"></div>' +
    '<div><label data-i18n="hh_rel"></label><input class="m_rel"></div>' +
    '</div>';
  div.querySelector('.rm').addEventListener('click', () => div.remove());
  div.querySelectorAll('input').forEach((el) => el.addEventListener('input', () => el.classList.remove('bad')));
  $('members').appendChild(div);
  div.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
}
$('addMember').addEventListener('click', addMemberRow);
addMemberRow();

/* ---------- validation ---------- */
const CIN_RE = /^[A-Za-z]{2}\d{5}[A-Za-z]$/;
function markBad(el) { el.classList.add('bad'); return el; }
function validateStep(n) {
  let firstBad = null; let msg = 'err_req';
  const need = (el, ok) => { if (!ok) { markBad(el); if (!firstBad) firstBad = el; } };
  const needYn = (q) => {
    if (!A.yn[q]) { const g = document.querySelector('.yn[data-q="' + q + '"]'); g.classList.add('bad'); if (!firstBad) firstBad = g; }
  };
  if (n === 1) {
    need($('f_first'), $('f_first').value.trim().length > 0);
    need($('f_last'), $('f_last').value.trim().length > 0);
    need($('f_dob'), !!$('f_dob').value);
    const cin = $('f_cin').value.trim();
    if (!cin) { need($('f_cin'), false); }
    else if (!CIN_RE.test(cin)) { markBad($('f_cin')); if (!firstBad) { firstBad = $('f_cin'); msg = 'err_cin'; } }
    need($('f_phone'), $('f_phone').value.replace(/\D/g, '').length >= 10);
    need($('f_addr'), $('f_addr').value.trim().length > 0);
    need($('f_csz'), $('f_csz').value.trim().length > 0);
  }
  if (n === 2) { need($('f_living'), !!$('f_living').value); ['housingPay', 'utilityShutoff', 'housingWaitlist'].forEach(needYn); }
  if (n === 3) { ['snap', 'wic', 'tanf', 'healthHome', 'jobHelp', 'schoolHelp', 'transportBarrier'].forEach(needYn); }
  if (n === 4) { ['chronic', 'fridgeMeds', 'pregnant', 'mobility'].forEach(needYn); }
  if (n === 5) { ['existingMeals', 'allergies', 'foodWorry', 'foodRanOut'].forEach(needYn); need($('f_mealPref'), !!$('f_mealPref').value); }
  if (n === 6) { needYn('transfer'); }
  if (firstBad) {
    $('errline').textContent = t(msg); $('errline').classList.add('on');
    firstBad.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return false;
  }
  return true;
}

/* ---------- assemble + submit ---------- */
function checkedValues(containerId) {
  return [...document.querySelectorAll('#' + containerId + ' input:checked')].map((c) => c.value);
}
function collectPayload() {
  const members = [...document.querySelectorAll('.member')].map((m) => ({
    name: m.querySelector('.m_name').value.trim(),
    cin: m.querySelector('.m_cin').value.trim().toUpperCase(),
    dob: m.querySelector('.m_dob').value,
    relationship: m.querySelector('.m_rel').value.trim(),
  })).filter((m) => m.name || m.cin || m.dob || m.relationship);
  return {
    program: 'scn-food-support', version: 1, lang: LANG, submittedAt: new Date().toISOString(),
    applicant: {
      first: $('f_first').value.trim(), last: $('f_last').value.trim(), dob: $('f_dob').value,
      cin: $('f_cin').value.trim().toUpperCase(), phone: $('f_phone').value.trim(),
      smsConsent: $('f_sms').checked,
      address: $('f_addr').value.trim(), cityStateZip: $('f_csz').value.trim(),
      email: $('f_email').value.trim(),
    },
    housing: {
      living: $('f_living').value, strugglesToPay: A.yn.housingPay, utilityShutoffThreat: A.yn.utilityShutoff,
      problems: checkedValues('homeProblems'), waitlistOrSubsidy: A.yn.housingWaitlist,
    },
    benefits: {
      snap: A.yn.snap, wic: A.yn.wic, tanf: A.yn.tanf,
      healthHome: A.yn.healthHome, healthHomeName: $('f_healthHomeName').value.trim(),
      jobHelp: A.yn.jobHelp, schoolHelp: A.yn.schoolHelp, transportBarrier: A.yn.transportBarrier,
    },
    health: {
      chronic: A.yn.chronic, chronicDetail: $('f_chronicDetail').value.trim(),
      fridgeMeds: A.yn.fridgeMeds, pregnant: A.yn.pregnant, dueDate: $('f_dueDate').value,
      mobilityDifficulty: A.yn.mobility,
    },
    food: {
      existingMealsProgram: A.yn.existingMeals, allergies: A.yn.allergies, dietDetail: $('f_dietDetail').value.trim(),
      equipmentNeeds: checkedValues('equipNeeds'), worryFoodRunOut: A.yn.foodWorry,
      foodDidNotLast: A.yn.foodRanOut, mealPreference: $('f_mealPref').value,
    },
    household: { members, isTransfer: A.yn.transfer, comments: $('f_comments').value.trim() },
  };
}

let sending = false;
async function submitApp() {
  if (sending) return;
  sending = true;
  const btn = $('btnNext');
  btn.setAttribute('aria-disabled', 'true');
  btn.innerHTML = '<span class="spin"></span>' + t('submitting');
  try {
    const payload = collectPayload();
    const ciphertext = await encryptEnvelope(payload);
    const r = await fetch(FN + '/scn-apply', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ciphertext, dob: payload.applicant.dob, lang: LANG }),
    });
    const j = await r.json();
    if (!j.ok || !j.ref) throw new Error(j.error || 'send');
    $('refOut').textContent = j.ref;
    $('trackLink').href = 'track.html?ref=' + encodeURIComponent(j.ref);
    $('wizard').style.display = 'none';
    $('doneView').style.display = '';
    window.scrollTo({ top: 0 });
  } catch (e) {
    $('errline').textContent = t('err_send'); $('errline').classList.add('on');
    btn.removeAttribute('aria-disabled'); btn.textContent = t('submit');
    sending = false;
  }
}

$('btnNext').addEventListener('click', () => {
  if (!validateStep(step)) return;
  if (step < LAST) { step++; paintDots(); } else { submitApp(); }
});
$('btnBack').addEventListener('click', () => { if (step > 1) { step--; paintDots(); } });
document.addEventListener('DOMContentLoaded', paintDots);
</script>
</body>
</html>
