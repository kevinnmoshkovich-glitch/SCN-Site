<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fine Care Food Support — Fresh groceries, covered by Medicaid</title>
<meta name="description" content="Fresh food boxes delivered to your door, covered by NY Medicaid through the Social Care Network. Apply online in about 10 minutes — free, encrypted, from Fine Care Pharmacy in Bushwick.">
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800;12..96,900&family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">

</head>
<body>

<header>
  <div class="hwrap">
    <a href="index.html"><img class="logo" src="fc-logo.png" alt="Fine Care Pharmacy"></a>
    <div class="brand"><span data-i18n="tagline"></span></div>
    <nav>
      <a class="nl on" href="index.html" data-i18n="nav_home"></a>
      <a class="nl" href="apply.html" data-i18n="nav_apply"></a>
      <a class="nl" href="track.html" data-i18n="nav_track"></a>
      <div class="lang"><button data-lang="en">EN</button><button data-lang="es">ES</button></div>
    </nav>
  </div>
</header>

<div class="hero">
  <div>
    <h1><span data-i18n="hero_h1a"></span><br><span class="u" data-i18n="hero_h1b"></span><br><span data-i18n="hero_h1c"></span></h1>
    <p class="sub" data-i18n="hero_sub"></p>
    <div class="hero-cta">
      <a class="cta" href="apply.html" data-i18n="hero_cta"></a>
      <a class="ghost" href="track.html" data-i18n="hero_track"></a>
    </div>
    <div class="hero-note" data-i18n="hero_note"></div>
  </div>
  <div class="ticket">
    <div class="t-head"><span data-i18n="tk_head"></span></div>
    <div class="t-body">
      <div class="t-row"><span class="k" data-i18n="tk_patient"></span><span class="v" data-i18n="tk_patient_v"></span></div>
      <div class="t-row"><span class="k" data-i18n="tk_rx"></span><span class="v" data-i18n="tk_rx_v"></span></div>
      <div class="t-row"><span class="k" data-i18n="tk_qty"></span><span class="v" data-i18n="tk_qty_v"></span></div>
      <div class="t-row"><span class="k" data-i18n="tk_ref"></span><span class="v" data-i18n="tk_ref_v"></span></div>
      <div class="t-row"><span class="k" data-i18n="tk_cov"></span><span class="v" data-i18n="tk_cov_v"></span></div>
      <div class="t-row"><span class="k" data-i18n="tk_copay"></span><span class="v" style="color:var(--blue)">$0.00</span></div>
    </div>
  </div>
</div>

<section class="band">
  <div class="bwrap">
    <div class="eyebrow" data-i18n="how_eyebrow"></div>
    <h2 data-i18n="how_h2"></h2>
    <div class="steps">
      <div class="step"><span class="strip" data-i18n="s1_strip"></span><h3 data-i18n="s1_h"></h3><p data-i18n="s1_p"></p></div>
      <div class="step"><span class="strip" data-i18n="s2_strip"></span><h3 data-i18n="s2_h"></h3><p data-i18n="s2_p"></p></div>
      <div class="step"><span class="strip" data-i18n="s3_strip"></span><h3 data-i18n="s3_h"></h3><p data-i18n="s3_p"></p></div>
    </div>
  </div>
</section>

<section class="band boxband">
  <div class="bwrap">
    <div class="eyebrow" data-i18n="box_eyebrow"></div>
    <h2 data-i18n="box_h2"></h2>
    <div class="produce">
      <div class="ptile"><svg viewBox="0 0 48 48"><circle cx="24" cy="27" r="15" fill="#E5462F"/><path d="M24 12c0-4 3-6 3-6" stroke="#2BB673" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="29" cy="10" rx="5" ry="3" fill="#2BB673" transform="rotate(24 29 10)"/></svg><div data-i18n="p1"></div></div>

      <div class="ptile"><svg viewBox="0 0 48 48"><path d="M14 34c-3-9 2-20 10-22 8 2 13 13 10 22-3 5-17 5-20 0z" fill="#8ABF5A" stroke="#182A44" stroke-width="2"/><path d="M24 12v22" stroke="#182A44" stroke-width="2"/></svg><div data-i18n="p3"></div></div>
      <div class="ptile"><svg viewBox="0 0 48 48"><rect x="13" y="10" width="22" height="28" rx="5" fill="#fff" stroke="#182A44" stroke-width="2"/><rect x="13" y="10" width="22" height="9" rx="4.5" fill="#7FB2E5" stroke="#182A44" stroke-width="2"/></svg><div data-i18n="p4"></div></div>
      <div class="ptile"><svg viewBox="0 0 48 48"><ellipse cx="24" cy="26" rx="16" ry="11" fill="#E89A4C" stroke="#182A44" stroke-width="2"/><path d="M10 26h28" stroke="#182A44" stroke-width="2"/></svg><div data-i18n="p5"></div></div>
      <div class="ptile"><svg viewBox="0 0 48 48"><rect x="12" y="16" width="24" height="20" rx="3" fill="#F2600C" stroke="#182A44" stroke-width="2"/><path d="M12 22h24" stroke="#fff" stroke-width="2.5"/><text x="24" y="33" text-anchor="middle" font-family="Space Mono" font-size="8" fill="#fff">HALAL</text></svg><div data-i18n="p6"></div></div>
    </div>
    <p class="boxnote" data-i18n="box_note"></p>
  </div>
</section>

<section class="band">
  <div class="bwrap">
    <div class="qual">
      <div>
        <div class="eyebrow" data-i18n="q_eyebrow"></div>
        <h2 data-i18n="q_h2"></h2>
        <p style="color:#334560; max-width:44ch" data-i18n="q_p"></p>
      </div>
      <div class="qlist">
        <div class="qi"><span class="tick">✓</span><span data-i18n="q1"></span></div>
        <div class="qi"><span class="tick">✓</span><span data-i18n="q2"></span></div>
        <div class="qi"><span class="tick">✓</span><span data-i18n="q3"></span></div>
        <div class="qi"><span class="tick">✓</span><span data-i18n="q4"></span></div>
      </div>
    </div>
  </div>
</section>

<section class="band" style="background:#fff">
  <div class="bwrap">
    <div class="eyebrow" data-i18n="faq_eyebrow"></div>
    <h2 data-i18n="faq_h2"></h2>
    <details><summary data-i18n="f1q"></summary><p data-i18n="f1a"></p></details>
    <details><summary data-i18n="f2q"></summary><p data-i18n="f2a"></p></details>
    <details><summary data-i18n="f3q"></summary><p data-i18n="f3a"></p></details>
    <details><summary data-i18n="f4q"></summary><p data-i18n="f4a"></p></details>
  </div>
</section>

<section class="band ctaband">
  <div class="bwrap">
    <div class="eyebrow" data-i18n="cta_eyebrow"></div>
    <h2><span data-i18n="cta_h2a"></span><br><span data-i18n="cta_h2b"></span></h2>
    <p data-i18n="cta_p"></p>
    <a class="cta" href="apply.html" data-i18n="hero_cta"></a>
  </div>
</section>

<footer>
  <div class="fwrap">
    <img src="fc-logo.png" alt="Fine Care Pharmacy" style="height:34px; width:auto">
    <div class="grow">380 Knickerbocker Ave, Brooklyn, NY 11237 · (718) 676-9976<br><span data-i18n="foot_tag"></span></div>
    <div class="flinks"><a href="#" data-i18n="foot_privacy"></a><a href="#" data-i18n="foot_sms"></a><a href="track.html" data-i18n="foot_track"></a></div>
  </div>
</footer>

<script src="i18n.js"></script>
</body>
</html>
